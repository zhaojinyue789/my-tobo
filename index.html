<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的待办</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="icon" type="image/png" href="./icons/icon-256.png" />
    <link rel="apple-touch-icon" href="./icons/icon-256.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <main class="app">
      <h1 class="app-title">我的待办</h1>
      <div class="sync-bar">
        <span id="sync-status" class="sync-status">
          <span id="sync-dot" class="sync-dot"></span>
          <span id="sync-text"></span>
        </span>
        <span class="sync-actions">
          <button id="sync-now" class="sync-btn" type="button" title="立即同步" aria-label="立即同步">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
            </svg>
          </button>
          <button id="sync-settings" class="sync-btn" type="button" title="同步设置" aria-label="同步设置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </span>
      </div>
      <header id="today-header" class="today-header">
        <div class="today-date">
          <span id="today-date-text"></span>
          <span id="today-progress" class="today-progress"></span>
        </div>
        <nav class="today-tabs" aria-label="视图切换">
          <button id="tab-today" class="today-tab" type="button" aria-selected="true">
            今天<span id="tab-today-count" class="tab-count"></span>
          </button>
          <button id="tab-all" class="today-tab" type="button" aria-selected="false">全部</button>
        </nav>
      </header>
      <div id="storage-warning" class="storage-warning hidden">
        存储空间已满，最近的改动可能没有保存，请清理旧待办后重试
      </div>
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input
          id="todo-input"
          class="todo-input"
          type="text"
          placeholder="想做点什么？"
          maxlength="200"
        />
        <button type="submit" class="btn btn-primary todo-add">添加</button>
      </form>
      <div id="list-area">
        <div id="overdue-box" class="overdue-box hidden">
          <button id="overdue-toggle" class="overdue-toggle" type="button" aria-expanded="true">
            <span class="overdue-arrow" aria-hidden="true">▾</span>
            <span id="overdue-title">已过期</span>
          </button>
          <ul id="overdue-list" class="todo-list overdue-list"></ul>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
      </div>
      <footer id="todo-footer" class="todo-footer hidden">
        <span id="todo-count"></span>
        <span class="todo-footer-actions">
          <button id="clear-completed" class="clear-completed" type="button">清除已完成</button>
          <button id="clear-all" class="clear-all" type="button">清除全部</button>
        </span>
      </footer>
    </main>

    <div id="focus-overlay" class="focus-overlay hidden">
      <div class="focus-card" role="dialog" aria-modal="true" aria-labelledby="focus-text">
        <p id="focus-category" class="focus-category"></p>
        <h2 id="focus-text" class="focus-text"></h2>
        <p id="focus-due" class="focus-due"></p>
        <div id="focus-timer" class="focus-timer" role="timer">00:00:00</div>
        <div class="focus-actions">
          <button id="focus-done" class="focus-btn primary" type="button">完成</button>
          <button id="focus-pause" class="focus-btn" type="button">暂停</button>
          <button id="focus-skip" class="focus-btn" type="button">跳过</button>
          <button id="focus-exit" class="focus-btn ghost" type="button">退出 (Esc)</button>
        </div>
      </div>
    </div>

    <div id="sync-modal" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
        <h2 id="sync-modal-title" class="modal-title">同步设置</h2>
        <p class="modal-hint">
          待办通过 GitHub 私密 Gist 在手机与电脑之间同步。需要一个仅勾选
          <code>gist</code> 权限的 Token：<a
            href="https://github.com/settings/tokens/new?scopes=gist&description=my-tobo"
            target="_blank"
            rel="noreferrer"
            >点此创建 Token</a
          >，粘贴到下方即可。手机端填同一个 Gist ID 与 Token。
        </p>
        <label class="modal-field">
          <span>GitHub Token</span>
          <input id="gist-token" type="password" placeholder="ghp_…" autocomplete="off" />
        </label>
        <label class="modal-field">
          <span>Gist ID</span>
          <input id="gist-id" type="text" placeholder="已有 Gist 就填 ID；没有就点“创建新私密 Gist”" />
        </label>
        <p id="sync-modal-error" class="modal-error hidden"></p>
        <div class="modal-actions">
          <button id="gist-create" class="modal-btn primary" type="button">创建新私密 Gist</button>
          <button id="gist-save" class="modal-btn" type="button">保存并连接</button>
          <button id="gist-disconnect" class="modal-btn danger" type="button">断开同步</button>
          <button id="gist-close" class="modal-btn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
