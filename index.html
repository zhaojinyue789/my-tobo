    <style rel="stylesheet" crossorigin>:root{--bg:#f4f5f7;--card:#fff;--text:#24292f;--text-muted:#8b949e;--accent:#3b82f6;--accent-dark:#2563eb;--border:#e5e7eb;--danger:#ef4444;--shadow:0 8px 24px #0000000f;--radius:12px}*{box-sizing:border-box}body{background:var(--bg);min-height:100vh;color:var(--text);justify-content:center;align-items:flex-start;margin:0;padding:33vh 16px 48px;font-family:system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;line-height:1.5;display:flex}.app{background:var(--card);border-radius:var(--radius);width:100%;max-width:480px;box-shadow:var(--shadow);padding:32px 28px 24px}.app-title{text-align:center;margin:0 0 20px;font-size:24px;font-weight:700}.todo-form{gap:10px;display:flex}.todo-input{min-width:0;color:var(--text);border:1px solid var(--border);background:#fafafa;border-radius:8px;outline:none;flex:1;padding:10px 14px;font-size:15px;transition:border-color .15s,box-shadow .15s}.todo-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3b82f626}.todo-input::placeholder{color:var(--text-muted)}.todo-add{color:#fff;background:var(--accent);cursor:pointer;border:none;border-radius:8px;flex:none;padding:10px 18px;font-size:15px;transition:background .15s}.todo-add:hover{background:var(--accent-dark)}.filters{gap:6px;margin-top:18px;display:flex}.filter{color:var(--text-muted);cursor:pointer;background:0 0;border:none;border-radius:999px;padding:5px 12px;font-size:13px;transition:color .15s,background .15s}.filter:hover{color:var(--accent)}.filter.is-active{color:var(--accent);background:#3b82f61a;font-weight:600}.todo-list{margin:12px 0 0;padding:0;list-style:none}.todo-item{border-bottom:1px solid var(--border);align-items:center;gap:10px;padding:11px 6px;display:flex}.todo-item:last-child{border-bottom:none}.todo-toggle{color:#0000;border:2px solid var(--border);cursor:pointer;background:#fff;border-radius:50%;flex:none;width:22px;height:22px;padding:0;font-size:13px;line-height:1;transition:border-color   <body>
    <main class="app">
      <h1 class="app-title">我的待办</h1>
      <div class="sync-bar">
        <span id="sync-status" class="sync-status">
          <span id="sync-dot" class="sync-dot"></span>
          <span id="sync-text"></span>
        </span>
        <span class="sync-actions">
          <button id="sync-now" class="sync-btn" type="button" title="立即同步" aria-label="立即同步">⟳</button>
          <button id="sync-settings" class="sync-btn" type="button" title="同步设置" aria-label="同步设置">⚙</button>
        </span>
      </div>
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input
          id="todo-input"
          class="todo-input"
          type="text"
          placeholder="想做点什么？"
          maxlength="200"
        />
        <button type="submit" class="todo-add">添加</button>
      </form>
      <div id="filters" class="filters">
        <button class="filter is-active" data-filter="all">全部</button>
        <button class="filter" data-filter="active">未完成</button>
        <button class="filter" data-filter="completed">已完成</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <footer id="todo-footer" class="todo-footer hidden">
        <span id="todo-count"></span>
        <button id="clear-completed" class="clear-completed">清除已完成</button>
      </footer>
    </main>

    <div id="sync-modal" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
        <h2 id="sync-modal-title" class="modal-title">同步设置</h2>
        <p class="modal-hint">
          待办通过 GitHub 私密 Gist 在手机与电脑之间同步。需要一个仅勾选
          <code>gist</code> 权限的 Token：<a
            href="https://github.com/settings/tokens/new?scopes=gist&description=my-tobo"
            target="_blank"
            rel="noreferrer"
            >点此创建 Token</a
          >，粘贴到下方即可。手机端填同一个 Gist ID 与 Token。
        </p>
        <label class="modal-field">
          <span>GitHub Token</span>
          <input id="gist-token" type="password" placeholder="ghp_…" autocomplete="off" />
        </label>
        <label class="modal-field">
          <span>Gist ID</span>
          <input id="gist-id" type="text" placeholder="已有 Gist 就填 ID；没有就点“创建新私密 Gist”" />
        </label>
        <p id="sync-modal-error" class="modal-error hidden"></p>
        <div class="modal-actions">
          <button id="gist-create" class="modal-btn primary" type="button">创建新私密 Gist</button>
          <button id="gist-save" class="modal-btn" type="button">保存并连接</button>
          <button id="gist-disconnect" class="modal-btn danger" type="button">断开同步</button>
          <button id="gist-close" class="modal-btn" type="button">关闭</button>
        </div>
      </div>
    </div>

  </body>
</html>
